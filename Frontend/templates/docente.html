<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Mis préstamos</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/docente.js" defer></script>
</head>
<body>
    <header>
        <h1>Mis solicitudes de préstamo</h1>
        <button id="boton-logout" type="button">
            Cerrar sesión
        </button>
    </header>

    <main>
        <section>
            <h2 id="titulo-formulario">Solicitar equipo</h2>

            <form id="formulario-ticket">
                <input
                    type="hidden"
                    id="id-ticket"
                >

                <div>
                    <label for="descripcion">
                        Motivo de préstamo
                    </label>
                    <textarea
                        id="descripcion"
                        maxlength="2000"
                        required
                    ></textarea>
                </div>

                <div>
                    <label for="sala">Dispositivo</label>
                    <select id="sala">
                        <option value="">
                            Sin dispositivo
                        </option>
                        <option value="Laptop Ceibal 01">Laptop Ceibal 01</option>
                        <option value="Laptop Ceibal 02">Laptop Ceibal 02</option>
                        <option value="Proyector Epson">Proyector Epson</option>
                        <option value="Tablet">Tablet</option>
                        <option value="Cámara digital">Cámara digital</option>
                        <option value="Kit de Robótica">Kit de Robótica</option>
                    </select>
                </div>

                <div>
                    <label for="prioridad">Prioridad</label>
                    <select id="prioridad" required>
                        <option value="">
                            Selecciona una prioridad
                        </option>
                    </select>
                     <p>
                        <a href="criterios-prioridad.html">
                            Consultar criterios de prioridad
                        </a>
                    </p>
                </div>

                <p id="mensaje-error" role="alert" hidden></p>
                <p id="mensaje-exito" role="status" hidden></p>

                <button type="submit">
                    Solicitar equipo
                </button>

                <button
                    id="boton-cancelar"
                    type="button"
                    hidden
                >
                    Cancelar modificación
                </button>
            </form>
        </section>

        <section>
            <h2>Préstamos solicitados</h2>

            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Motivo</th>
                        <th>Dispositivo</th>
                        <th>Prioridad</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="lista-tickets"></tbody>
            </table>

            <p id="sin-tickets" hidden>
                No tienes préstamos registrados.
            </p>
        </section>
    </main>
</body>
</html>
